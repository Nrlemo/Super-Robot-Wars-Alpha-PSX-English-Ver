name: Bug report
description: Untranslated Japanese, cut-off or overlapping text, broken glyphs, crashes
labels: [bug]
assignees: nrlemo
body:
  - type: input
    id: build
    attributes:
      label: Patched ISO MD5
      description: V1.00 should be 8cc4b3af159d26d11cad46b136a5c833
    validations: {required: true}
  - type: input
    id: platform
    attributes:
      label: How are you running it?
      description: PCSX2 (version) / OPL (how loaded) / real console
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and on which screen?
      description: Attach a screenshot if you can.
    validations: {required: true}
